slurm:
  job_name: validation_closure_m100_ph202
  account: desi
  qos: regular
  constraint: "gpu&hbm80g"  # 80 GB A100s: the joint does not fit 40 GB (docs/hpc.md)
  nodes: 1
  gpus: 4
  time: '21:00:00'  # the ph201 mesh-100 joint: warm-up 13.8 h, 16 min per batch; 20 batches ≈ 19.5 h at order 2; check the NERSC queue table before submitting
model:
  cell_size: 50.0  # 5000 / 100: final k_N 0.063 h/Mpc, the finest galaxy grid that holds on Abacus (pipeline 7.19)
  box_shape:
  - 5000.0
  - 5000.0
  - 5000.0
  galaxies_enabled: true
  bias_order: 3  # third-order Lagrangian biases b3, bds2, bs3: Abacus follows its closure with them at mesh 100 (pipeline 2.4, 7.19)
  b1_sigma8: true  # sample (1 + b1) sigma8 / sigma8_fid instead of b1, same posterior: b1 and sigma8 decorrelate (pipeline 5)
  gxy_stoch_noise: true  # galaxy noise std s_e (1 + s_ed max(delta_m, -1)) sqrt(n̄S): s_e, s_ed inferred (true) or 1, 0 (false), pipeline 3.1
  bias_evolution: redshift  # redshift: on the light cone b1 evolves with b1_alpha, b2 and bs2 follow b1 (quenched-galaxy relations, arXiv:2412.06886); none: constant biases (pipeline 2.4)
  gxy_ngbar_free: false
  lightcone: true
  a_obs: null
  curved_sky: true
  evolution: lpt
  lpt_order: 2
  precond: kaiser
  init_oversamp: 2.4  # 240^3 initial field, k_N 0.15 h/Mpc, as at mesh 160
  # Particle count N = evol_oversamp x final cells (even); check before a run (docs/pipeline.md 2.5):
  #   galaxies: N not commensurate with the paint grid (the model refuses N = paint or 2 x paint) and evolution - init grid >= final/4 (else a warning);
  #   before a run, scripts/galaxy_likelihood_profile.py --mode newton at the true ICs: A_min within about sigma_A of 1 (docs/pipeline.md 2.5, 7.16)
  #   CMB lensing: box / N <= 25 Mpc/h (the model warns otherwise).
  evol_oversamp: 2.8  # 280^3 particles, spacing 17.9 Mpc/h, as at mesh 160: same kappa model (pipeline 7.19)
  ptcl_oversamp: 2.8
  paint_oversamp: 2.6  # 260^3 paint grid, not commensurate with the 280^3 particles (pipeline 2.5, 7.16)
  gxy_density: 0.000843318125
  png_type: fNL
cmb_lensing:
  enabled: true
  z_source: 1089.28
  nside: 128  # l <= 256 (pipeline 7.19)
  n_shells: 32
  chi_matter_min: 292.6
  shell_weights: linear
  proj_oversamp: 2
  cmb_noise_nell: /global/homes/j/jhawla/thesis-desi-cmb-fli/data/N_L_kk_so_v3_1_1_baseline_mv.txt  # Simons Observatory baseline (MV, iterative), pipeline 3.2
  cmb_noise_scaling: 1.0
  full_los_correction: true
  cl_out_mode: exact  # the out-of-model term follows Omega_m, sigma8 (docs/pipeline.md 3.2)
  likelihood_mode: diagonal
  kl_rcond: 1e-2
  chi_high_z_max: 3750
  observer_mode: center
truth_params:  # ph202 joint minimum at the true ICs, order 3 (figures/galaxy_likelihood_profile/abacus_gxyonly_cosmo_box5000_m100_ph202_newton.json), the held noise
  Omega_m: 0.315192
  sigma8: 0.811355
  b1: 1.132233
  b1_alpha: 1.078765
  b2: 0.400050
  bs2: -0.169056
  bn2: -1.730368
  bnpar: -14.556336
  b3: -1.090335
  bds2: -0.450996
  bs3: 0.549191
  s_e: 0.8999
  s_ed: 0.2137
  fNL: 0.0
latents:
  # Sampler unit (scale_fid) and start (loc_fid) of each inferred scalar at the free-IC posterior of the ph202 galaxies
  # alone (run_20261119_042045_61543513, batches 20-39), the priors (loc, scale) unchanged: a unit narrower than the
  # posterior is learnt too narrow by the warm-up and the scalars mix slowly (pipeline 5, 7.19). Omega_m, sigma8, b1
  # keep their loc_fid, which also sets the Kaiser preconditioner and b1_sigma8.
  b3:
    loc_fid: -1.35
    scale_fid: 0.31
  bds2:
    loc_fid: -0.38
    scale_fid: 0.17
  bs3:
    loc_fid: -1.04
    scale_fid: 0.59
  b1_alpha:
    loc_fid: 1.036
    scale_fid: 0.017
  fNL:
    loc: 0.0
    scale: 10000.0
    scale_fid: 2.0
    loc_fid: 0.0
  fNL_bp:
    loc: 0.0
    scale: 10000.0
    scale_fid: 30.0
    loc_fid: 0.0
  fNL_bpd:
    loc: 0.0
    scale: 10000.0
    scale_fid: 300.0
    loc_fid: 0.0
  Omega_m:  # joint: the mesh-100 Fisher widths (pipeline 8)
    loc: 0.315192
    scale: 0.15
    scale_fid: 0.0031
    loc_fid: 0.315192
    low: 0.2
    high: 0.55
  sigma8:
    loc: 0.811355
    scale: 0.15
    scale_fid: 0.0044
    loc_fid: 0.811355
    low: 0.5
    high: 1.2
  b1:  # unit of the sampled (1 + b1) sigma8 / sigma8_fid - 1
    loc: 1.15
    scale: 100.0
    scale_fid: 0.025
    loc_fid: 1.15
  b2:
    loc: 0.0
    scale: 100.0
    scale_fid: 0.083
    loc_fid: 0.77
  bs2:
    loc: 0.0
    scale: 100.0
    scale_fid: 0.061
    loc_fid: -0.24
  bn2:
    loc: 0.0
    scale: 1000.0
    scale_fid: 2.8
    loc_fid: 6.0
  bnpar:
    loc: 0.0
    scale: 100.0
    scale_fid: 5.4
    loc_fid: -12.1
  # Galaxy noise (gxy_stoch_noise): informative prior from the Abacus LRG residual at the true ICs, the
  # maximum-likelihood s_e, s_ed (0.901, 0.221 ph201; 0.900, 0.214 ph202, at mesh 100), width the spread of
  # the noise level across redshift shells; free, s_e and s_ed fall and the chains over-fit (pipeline 3.1, 7.19)
  s_e:  # fit at the true ICs, final grids and noise-free selection, order 3 (galaxy_likelihood_profile.py --mode newton, pipeline 7.19): ph202 0.900, 0.214; ph201 0.901, 0.221
    loc: 0.8999
    scale: 0.03
    loc_fid: 0.8999
  s_ed:
    loc: 0.2137
    scale: 0.03
    loc_fid: 0.2137
mcmc:
  num_warmup: 8192
  fixed_params:  # Omega_m and sigma8 inferred; fNL at its truth; the noise held at its ph202 fit (loc_fid), as the galaxies alone (_noiseheld): under its prior s_e collapses (pipeline 3.1, 7.19)
  - fNL
  - s_e
  - s_ed
  num_samples: 50
  num_batches: 20  # first look; --resume (submit.py --resume) if the traces are sound
  num_chains: 4
  mesh_desired_energy_var: 1.0e-05
  mclmc:
    desired_energy_var: 1.0e-09  # 120^3 closures hold at 7e-10 and 3-6e-9 per dimension (pipeline 7.19)
    diagonal_preconditioning: true
    thinning: 5
observation_mode: closure
closure_geometry_from_abacus: true  # the ph202 randoms set the selection; the data are generated from truth_params
closure_gxy_density_scale: 1.0
abacus_truth_params:
  Omega_m: 0.315192
  sigma8: 0.811355
  fNL: 0.0
  fNL_bp: 0.0
  fNL_bpd: 0.0
abacus_kappa:
  file: /global/cfs/cdirs/desi/cosmosim/AbacusLensing/v1/AbacusSummit_huge_c000_ph202/kappa_00045.asdf
  noise_seed: 202  # ph202: the sky number (fixed before any ph202 result; ph201 runs drew 6482)
abacus_galaxy:
  file: /global/cfs/projectdirs/desi/mocks/cai/abacus_HF_lightcones/DR2/mock_catalogs/lrg_huge/LRG_AbacusSummit_huge_c000_ph202_base_cmaes_opt_0_fit_DESI_nz_data.fits
  randoms: /global/cfs/projectdirs/desi/mocks/cai/abacus_HF_lightcones/DR2/mock_catalogs/lrg_huge/LRG_AbacusSummit_huge_c000_ph202_base_cmaes_opt_0_fit_DESI_nz_randoms_100x.fits
  z_range:
  - 0.4
  - 1.1
  randoms_chunk_rows: 50000000
  completeness_min: 0.3
abacus_ic:
  file: /global/cfs/cdirs/desi/public/cosmosim/AbacusSummit/ic/AbacusSummit_huge_c000_ph202/ic_dens_N576.asdf
seed: 77
