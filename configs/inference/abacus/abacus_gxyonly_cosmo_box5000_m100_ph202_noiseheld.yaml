slurm:
  job_name: cosmo_gxyonly_abacushuge_cut03_ngbarsfixed_box5000_m100_ph202_noiseheld
  account: desi
  qos: regular
  constraint: "gpu&hbm80g"  # 80 GB A100s: the joint does not fit 40 GB (docs/hpc.md)
  nodes: 1
  gpus: 4
  time: '12:00:00'  # ph202 prior run: warm-up 5.3 h, 6.3 min per batch; 40 batches ≈ 9.5 h; check the NERSC queue table before submitting
model:
  cell_size: 50.0  # 5000 / 100: final k_N 0.063 h/Mpc, the finest galaxy grid that holds on Abacus (pipeline 7.19)
  box_shape:
  - 5000.0
  - 5000.0
  - 5000.0
  galaxies_enabled: true
  bias_order: 3  # third-order Lagrangian biases b3, bds2, bs3: Abacus follows its closure with them at mesh 100 (pipeline 2.4, 7.19)
  b1_sigma8: true  # sample (1 + b1) sigma8 / sigma8_fid instead of b1, same posterior: b1 and sigma8 decorrelate (pipeline 5)
  gxy_stoch_noise: true  # galaxy noise std s_e (1 + s_ed max(delta_m, -1)) sqrt(n̄S): s_e, s_ed inferred (true) or 1, 0 (false), pipeline 3.1
  bias_evolution: redshift  # redshift: on the light cone b1 evolves with b1_alpha, b2 and bs2 follow b1 (quenched-galaxy relations, arXiv:2412.06886); none: constant biases (pipeline 2.4)
  gxy_ngbar_free: false
  lightcone: true
  a_obs: null
  curved_sky: true
  evolution: lpt
  lpt_order: 2
  precond: kaiser
  init_oversamp: 2.4  # 240^3 initial field, k_N 0.15 h/Mpc, as at mesh 160
  # Particle count N = evol_oversamp x final cells (even); check before a run (docs/pipeline.md 2.5):
  #   galaxies: the galaxy profile at the true ICs (scripts/galaxy_likelihood_profile.py) has its minimum in A within 0.02 of 1 (docs/pipeline.md 7.16)
  evol_oversamp: 2.8  # 280^3 particles, spacing 17.9 Mpc/h, as at mesh 160: same kappa model (pipeline 7.19)
  ptcl_oversamp: 2.8
  paint_oversamp: 2.8
  gxy_density: 0.000843318125
  png_type: fNL
cmb_lensing:
  enabled: false
  z_source: 1089.28
  nside: 128  # l <= 256 (pipeline 7.19)
  n_shells: 32
  chi_matter_min: 292.6
  shell_weights: linear
  proj_oversamp: 2
  cmb_noise_nell: /global/homes/j/jhawla/thesis-desi-cmb-fli/data/N_L_kk_so_v3_1_1_baseline_mv.txt  # Simons Observatory baseline (pipeline 3.2)
  cmb_noise_scaling: 1.0
  full_los_correction: true
  cl_out_mode: fixed
  likelihood_mode: diagonal
  kl_rcond: 1e-2
  chi_high_z_max: 3750
  observer_mode: center
truth_params:
  Omega_m: 0.315192
  sigma8: 0.811355
  b1: 1.15
  b2: 0.0
  bs2: 0.0
  bn2: 0.0
  fNL: 0.0
latents:
  b3:  # preconditioning unit at the posterior width measured at the true ICs (b3, bds2, bs3 curvature, pipeline 7.19)
    scale_fid: 0.02
  bds2:
    scale_fid: 0.017
  bs3:
    scale_fid: 0.037
  fNL:
    loc: 0.0
    scale: 10000.0
    scale_fid: 2.0
    loc_fid: 0.0
  fNL_bp:
    loc: 0.0
    scale: 10000.0
    scale_fid: 30.0
    loc_fid: 0.0
  fNL_bpd:
    loc: 0.0
    scale: 10000.0
    scale_fid: 300.0
    loc_fid: 0.0
  Omega_m:
    loc: 0.315192
    scale: 0.15
    scale_fid: 0.05
    loc_fid: 0.315192
    low: 0.2
    high: 0.55
  sigma8:
    loc: 0.811355
    scale: 0.15
    scale_fid: 0.05
    loc_fid: 0.811355
    low: 0.5
    high: 1.2
  b1:
    loc: 1.15
    scale: 100.0
    scale_fid: 0.01
    loc_fid: 1.15
  b2:
    loc: 0.0
    scale: 100.0
    scale_fid: 0.03
    loc_fid: 0.0
  bs2:
    loc: 0.0
    scale: 100.0
    scale_fid: 0.1
    loc_fid: 0.0
  bn2:
    loc: 0.0
    scale: 1000.0
    scale_fid: 1.0
    loc_fid: 0.0
  bnpar:
    loc: 0.0
    scale: 100.0
    scale_fid: 1.0
    loc_fid: 0.0
  # Galaxy noise (gxy_stoch_noise): informative prior from the Abacus LRG residual at the true ICs, the
  # maximum-likelihood s_e, s_ed (0.920, 0.229 at mesh 100; 0.924, 0.234 at mesh 160), width the spread of
  # the noise level across redshift shells; free, s_e and s_ed fall and the chains over-fit (pipeline 3.1, 7.19)
  s_e:  # ph202 fit at the true ICs with the order-3 biases refitted: 0.9607, 0.2362 (logs/ph202_prep/refit.log; ph201 0.914, 0.227)
    loc: 0.961
    scale: 0.03
    loc_fid: 0.961
  s_ed:
    loc: 0.236
    scale: 0.03
    loc_fid: 0.236
mcmc:
  num_warmup: 8192
  fixed_params:  # Omega_m and sigma8 inferred; fNL at its truth; the noise held at its ph202 fit (abacus_truth_params): under its prior s_e collapses (pipeline 7.19)
  - fNL
  - s_e
  - s_ed
  num_samples: 50
  num_batches: 40  # >= 37 batches at the production step (pipeline 8 step 2)
  num_chains: 4
  mesh_desired_energy_var: 1.0e-05
  mclmc:
    desired_energy_var: 1.0e-09  # 120^3 closures hold at 7e-10 and 3-6e-9 per dimension (pipeline 7.19)
    diagonal_preconditioning: true
    thinning: 5
observation_mode: abacus
abacus_truth_params:
  s_e: 0.9607  # ph202 fit at the true ICs (logs/ph202_prep/refit.log), the held noise
  s_ed: 0.2362
  Omega_m: 0.315192
  sigma8: 0.811355
  fNL: 0.0
  fNL_bp: 0.0
  fNL_bpd: 0.0
abacus_kappa:
  file: /global/cfs/cdirs/desi/cosmosim/AbacusLensing/v1/AbacusSummit_huge_c000_ph202/kappa_00045.asdf
  noise_seed: 202  # ph202: the sky number (fixed before any ph202 result; ph201 runs drew 6482)
abacus_galaxy:
  file: /global/cfs/projectdirs/desi/mocks/cai/abacus_HF_lightcones/DR2/mock_catalogs/lrg_huge/LRG_AbacusSummit_huge_c000_ph202_base_cmaes_opt_0_fit_DESI_nz_data.fits
  randoms: /global/cfs/projectdirs/desi/mocks/cai/abacus_HF_lightcones/DR2/mock_catalogs/lrg_huge/LRG_AbacusSummit_huge_c000_ph202_base_cmaes_opt_0_fit_DESI_nz_randoms_100x.fits
  z_range:
  - 0.4
  - 1.1
  randoms_chunk_rows: 50000000
  completeness_min: 0.3
abacus_ic:
  file: /global/cfs/cdirs/desi/public/cosmosim/AbacusSummit/ic/AbacusSummit_huge_c000_ph202/ic_dens_N576.asdf
seed: 77
